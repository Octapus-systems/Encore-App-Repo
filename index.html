<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/images/logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Encore Executive — premium chauffeur booking and management. Staffordshire-based, UK-wide." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..700,0..1,0&display=block" />
    <title>Encore Executive</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app loads: the Encore mark traces itself on a dark screen. -->
      <div style="position:fixed;inset:0;display:grid;place-items:center;background:#0b0b0c">
        <style>
          @keyframes bt{0%{stroke-dashoffset:1}50%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
          @keyframes bj{0%,15%{transform:scale(.7);opacity:0}45%,80%{transform:scale(1);opacity:1}100%{opacity:0}}
          .b-f{stroke-dasharray:1;animation:bt 2.4s cubic-bezier(.6,0,.3,1) infinite}
          .b-j{transform-origin:50px 52px;animation:bj 2.4s cubic-bezier(.3,1.3,.5,1) infinite}
        </style>
        <svg viewBox="0 0 100 100" width="96" height="96" aria-label="Loading Encore">
          <rect class="b-f" x="13.4" y="13.4" width="73.2" height="73.2" rx="15" fill="none" stroke="#FF6B00" stroke-width="5.2" stroke-linecap="round" pathLength="1"/>
          <polygon class="b-j" fill="#FF6B00" points="23.7,29.6 39.2,21.4 61.2,21.4 76.6,29.6 82,43.2 78.8,62 70.4,72.8 49.8,80.8 29.6,72.8 21.2,62 18.2,43.2"/>
          <g fill="#fff"><polygon points="41.6,18.2 47.8,23.8 38.8,29.4 39,21.4"/><polygon points="58.6,18.2 61.2,21.4 61.4,29.4 52.4,23.8"/><polygon points="45.8,27.4 48,30 41.8,51.6 45,56.2 38.7,51.2 39.6,31.4"/><polygon points="54.2,27.4 60.6,31.4 61.3,51.2 54.8,56.2 58.2,51.6 52.1,30"/></g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
